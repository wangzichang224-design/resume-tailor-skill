[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailor your resume to match any job description — JD parsing, experience retrieval, Markdown generation, PDF export"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28"]

[project.scripts]
resume-tailor = "resume_tailor.pipeline:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["resume_tailor*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
